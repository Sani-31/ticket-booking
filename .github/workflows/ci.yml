name: FairDrop CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fairdrop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fairdrop/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: fairdrop/backend
        run: npm ci

      - name: TypeScript type check
        working-directory: fairdrop/backend
        run: npm run build

      - name: Run backend tests
        working-directory: fairdrop/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/fairdrop_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          SEAT_HOLD_MINUTES: "10"
          ADMIN_SECRET: test-admin-secret
          CORSORIGIN: http://localhost:3000
        run: npm test --if-present

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fairdrop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: fairdrop/frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: fairdrop/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: fairdrop/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build
